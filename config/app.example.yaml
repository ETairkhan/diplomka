

app:
    name: "AI"
    env: development
    language: ru

database:
    host: ${DB_HOST}
    port: ${DB_PORT}
    name: ${DB_NAME}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

storage:
    endpoint: ${MINIO_ENDPOINT}
    bucket: ${MINIO_BUCKET}
    audio_retention_days: 30

queue:
    url: ${RABBITMQ_URL}
    retries: 3

ml:
    asr_model: large-v3
    language: ru
    denoise_model: to-be-chosen

llm:
    provider: ${LLM_PROVIDER}
    model: ${LLM_MODEL}
    api_key: ${LLM_API_KEY}
    temperature: 0.2

roles:
    - system_admin
    - org_admin
    - teacher
    - student
    - parent
